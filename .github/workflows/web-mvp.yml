name: Web strategy MVP
on:
  push:
    branches: ['arena/94d215f9-iron-crowns']
    paths: ['web/**', '.github/workflows/web-mvp.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-mvp.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
