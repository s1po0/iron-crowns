name: Android APK
on:
  push:
    branches: ['arena/94d215f9-iron-crowns']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify campaign rules
        run: bash scripts/test.sh
      - name: Build installable prototype
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Package build evidence
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Iron-Crowns-0.1.0-prototype.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          printf 'Commit: %s\nVersion: 0.1.0-prototype\nVariant: debug (prototype signing only)\n' "$GITHUB_SHA" > artifacts/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Iron-Crowns-Android
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/
          if-no-files-found: ignore
