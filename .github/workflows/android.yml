name: Android APK
on:
  push:
    branches: ['arena/94d215f9-iron-crowns']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Verify campaign rules
        run: bash scripts/test.sh
      - name: Build installable prototype
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:lintDebug 2>&1 | tee /tmp/build.log || {
            python3 -c 's=open("/tmp/build.log").read()[-12000:]; print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          }
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh
      - name: Package build evidence
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Iron-Crowns-0.1.0-prototype.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          printf 'Commit: %s\nVersion: 0.1.0-prototype\nVariant: debug (prototype signing only)\n' "$GITHUB_SHA" > artifacts/BUILD.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Iron-Crowns-Android
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/
          if-no-files-found: ignore
      - name: Publish requested prototype prerelease
        if: contains(github.event.head_commit.message, '[publish prototype]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-prototype \
            artifacts/Iron-Crowns-0.1.0-prototype.apk \
            artifacts/SHA256SUMS.txt artifacts/BUILD.txt artifacts/SMOKE-TEST.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Iron Crowns 0.1.0 — Android playable prototype" \
            --notes-file docs/RELEASE_0.1.0.md
